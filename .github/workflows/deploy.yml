name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Project site is served under /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public client config — set these as repo Secrets (Settings →
          # Secrets and variables → Actions). VITE_* values ship in the bundle,
          # so use ONLY public keys (Supabase anon key, tile key restricted by
          # allowed origins). Never put the service key here.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TILE_URL: ${{ secrets.VITE_TILE_URL }}
          VITE_TILE_API_KEY: ${{ secrets.VITE_TILE_API_KEY }}
          VITE_TILE_ATTRIBUTION: ${{ secrets.VITE_TILE_ATTRIBUTION }}
        run: npm run build
      - name: SPA fallback (404 = index)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
